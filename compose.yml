# code-server behind Traefik.
#
#   ./up.sh        # or: CODER_PASSWORD=... docker compose up -d --build
#
# devbox: https://code.localhost   (self-signed cert made by up.sh; hostname is DEVBOX_HOST,
# host ports are HTTPS_PORT and HTTP_PORT, which redirects to HTTPS)
# *.localhost resolves to 127.0.0.1 in most browsers and on most Linux systems; if it does not on yours,
# add a hosts entry (127.0.0.1 code.localhost) or pick another name via DEVBOX_HOST.
# Traefik dashboard: https://traefik.localhost (TRAEFIK_HOST), basic auth admin / CODER_PASSWORD.
# Portainer: https://portainer.localhost (PORTAINER_HOST), admin / CODER_PASSWORD (created on first start).
# Other containers can join this stack's network (devbox_network) and add traefik.* labels to get their own hostname.

services:
  traefik:
    image: traefik:v3.6
    container_name: devbox-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      # traefik/dynamic/ holds transports.yml and tls.yml (written by up.sh); changes are picked up live
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/certs:ro
      - ./traefik/dynamic:/dynamic:ro
      # read-only, but the Docker socket is still powerful: dev use only
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOST:-traefik.localhost}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      # user "admin", password CODER_PASSWORD (htpasswd hash made by up.sh; the default matches no password)
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_AUTH:-admin:!}
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    command: --admin-password-file=/run/secrets/portainer_admin_password
    secrets:
      - portainer_admin_password
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST:-portainer.localhost}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.services.portainer.loadbalancer.server.port=9000
    depends_on:
      - traefik
    restart: unless-stopped

  devbox:
    build: .
    image: claude-vscode-ubuntu
    container_name: ${CONTAINER_NAME:-claude-browser-ubuntu}
    environment:
      PASSWORD: ${CODER_PASSWORD:-changeme}
    volumes:
      - claude_coder_home:/home/ubuntu
      - ${HOME}/Projects:/home/ubuntu/workspace
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    # The socket's group ID differs per host: DOCKER_GID=$(stat -c %g /var/run/docker.sock)
    group_add:
      - "${DOCKER_GID:-999}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.devbox.rule=Host(`${DEVBOX_HOST:-code.localhost}`)
      - traefik.http.routers.devbox.entrypoints=websecure
      - traefik.http.routers.devbox.tls=true
      - traefik.http.services.devbox.loadbalancer.server.port=8080
    depends_on:
      - traefik
    restart: unless-stopped

# written by up.sh from CODER_PASSWORD
secrets:
  portainer_admin_password:
    file: ./secrets/portainer_admin_password

# One named network shared by every service (and by any container that joins it)
networks:
  default:
    name: ${NETWORK_NAME:-devbox_network}

volumes:
  portainer_data:
    name: portainer_data
  claude_coder_home:
    # Reuse the volume created by earlier versions of up.sh
    name: ${VOLUME_NAME:-claude_coder_home}
